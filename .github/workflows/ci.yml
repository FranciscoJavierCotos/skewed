name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm content:validate
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
  db-e2e:
    runs-on: ubuntu-latest
    env:
      # Session-pooler connection string for the production project (direct connections are IPv6-only).
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Direct db.<ref>.supabase.co hosts are IPv6-only and runners have no IPv6, so a direct URL is
      # rewritten to the Supavisor session pooler. A pooler URL in the secret passes through unchanged.
      - name: Use the session pooler
        if: env.SUPABASE_DB_URL != ''
        env:
          POOLER_HOST: aws-1-eu-west-3.pooler.supabase.com
        run: |
          re='^postgres(ql)?://postgres:(.+)@db\.([a-z0-9]+)\.supabase\.co:5432/(.+)$'
          if [[ "$SUPABASE_DB_URL" =~ $re ]]; then
            url="postgresql://postgres.${BASH_REMATCH[3]}:${BASH_REMATCH[2]}@${POOLER_HOST}:5432/${BASH_REMATCH[4]}"
            echo "::add-mask::$url"
            echo "SUPABASE_DB_URL=$url" >> "$GITHUB_ENV"
            echo "Rewrote the direct connection URL to the session pooler."
          fi
      # pgTAP runs against production inside begin/rollback, so its fixtures never persist. No Docker.
      - name: pgTAP (production, rolled back)
        if: env.SUPABASE_DB_URL != ''
        run: |
          out=$(psql "$SUPABASE_DB_URL" -X -At -v ON_ERROR_STOP=1 -f supabase/tests/database/rpc.test.sql)
          echo "$out"
          if echo "$out" | grep -Eq '^not ok|Looks like'; then exit 1; fi
      - run: pnpm tsx scripts/validate-content.ts fixtures/content
      - run: pnpm exec playwright install --with-deps chromium
      # Supabase RPCs are mocked from fixtures/content (e2e/fixture-api.ts): e2e never touches production.
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: "test-results\nplaywright-report" }
