id: spark-l5-0003
topic: spark
level: 5
title: Switch to a broadcast join after a selective filter
prompt: |
  `dims` is about 5 GB on disk, but the query keeps a single category, which
  leaves about 2 MB. Spark plans a sort-merge join because its estimate is based
  on the whole table. Without adding a hint, make Spark **switch to a broadcast
  hash join at runtime** once it sees how small the filtered side really is.
context: |
  `facts(order_id, product_id, note)` is large. `dims(product_id, name, cat)` is
  a Parquet table with no statistics. AQE is disabled and the broadcast
  threshold is the default 10 MB.
options:
  - code: |
      spark.conf.set("spark.sql.adaptive.enabled", "true")
      facts.join(dims.filter("cat = 7"), "product_id")
    correct: true
    explanation: >-
      AQE re-plans once the filtered side's shuffle stage has run. Its measured
      size is under the threshold, so the sort-merge join becomes a broadcast
      hash join.
  - code: |
      spark.conf.set("spark.sql.adaptive.enabled", "true")
      spark.conf.set("spark.sql.adaptive.autoBroadcastJoinThreshold", "-1")
      facts.join(dims.filter("cat = 7"), "product_id")
    correct: false
    explanation: >-
      AQE uses its own adaptive broadcast threshold for runtime conversions.
      Setting it to -1 forbids exactly this switch, so the join stays
      sort-merge.
  - code: |
      small = dims.filter("cat = 7").cache()
      facts.join(small, "product_id")
    correct: false
    explanation: >-
      The cache isn't materialised when the query is planned, so the planner
      still uses the estimate from the full table and picks a sort-merge join.
  - code: |
      spark.conf.set("spark.sql.cbo.enabled", "true")
      facts.join(dims.filter("cat = 7"), "product_id")
    correct: false
    explanation: >-
      The cost-based optimizer needs statistics from `ANALYZE TABLE`. Without
      them the size estimate doesn't change and the join stays sort-merge.
tags: [aqe, broadcast-join, join-strategies]
docs_url: https://spark.apache.org/docs/latest/sql-performance-tuning.html#converting-sort-merge-join-to-broadcast-join
status: approved
