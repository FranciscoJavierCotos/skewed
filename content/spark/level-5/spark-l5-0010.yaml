id: spark-l5-0010
topic: spark
level: 5
title: Approximate distinct counts without an Expand
prompt: |
  A dashboard shows the number of distinct `user_id`, `device_id` and `ip`
  values per day. The exact version's plan **Expands** every row once per
  column before shuffling. Counts within 5% are fine. Compute all three in one
  aggregation whose plan has **no Expand**.
context: |
  `df(user_id, device_id, ip)`. `F` is `pyspark.sql.functions`.
options:
  - code: |
      df.agg(*[F.approx_count_distinct(c, 0.01) for c in ("user_id", "device_id", "ip")])
    correct: true
    explanation: >-
      Each column gets a fixed-size HyperLogLog++ sketch, updated in a single
      aggregation without an Expand. A relative standard deviation of 1% keeps
      the estimates well within the 5% tolerance.
  - code: |
      df.agg(*[F.countDistinct(c) for c in ("user_id", "device_id", "ip")])
    correct: false
    explanation: >-
      Several exact distinct counts over different columns are rewritten with an
      Expand that copies every row once per column.
  - code: |
      df.agg(F.countDistinct("user_id", "device_id", "ip"))
    correct: false
    explanation: >-
      This returns a single count of distinct `(user_id, device_id, ip)`
      combinations, not three separate counts.
  - code: |
      df.agg(*[F.approx_count_distinct(c, 0.3) for c in ("user_id", "device_id", "ip")])
    correct: false
    explanation: >-
      `0.3` allows a relative standard deviation of 30%, so the estimates
      routinely fall far outside the 5% tolerance.
tags: [query-plans, aggregation, approximate-algorithms]
docs_url: https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.functions.approx_count_distinct.html
status: approved
