id: spark-l5-0009
topic: spark
level: 5
title: Sort each output file without a global sort
prompt: |
  A downstream reader needs each Parquet file sorted by `ts`, so that row-group
  min/max statistics are tight. A global order across files isn't needed, and
  the job must **not add a shuffle**: `df` is already partitioned the way it
  should be written.
context: |
  `df(event_id, ts)` already has the right partitions. AQE is disabled.
options:
  - code: |
      df.orderBy("ts")
    correct: false
    explanation: >-
      A global sort range-partitions the whole dataset by `ts`, which adds a
      shuffle and throws away the existing partitioning.
  - code: |
      df.sortWithinPartitions("ts")
    correct: true
    explanation: >-
      Each partition is sorted locally, so every file comes out ordered by `ts`
      and the plan has no exchange.
  - code: |
      df.repartition("ts")
    correct: false
    explanation: >-
      Hash-partitioning by `ts` adds a shuffle and doesn't sort anything inside
      the partitions.
  - code: |
      df.repartitionByRange("ts")
    correct: false
    explanation: >-
      Range partitioning adds a shuffle and only groups ranges of `ts` together.
      Rows inside each partition still aren't sorted.
tags: [query-plans, sorting, shuffle]
docs_url: https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrame.sortWithinPartitions.html
status: approved
