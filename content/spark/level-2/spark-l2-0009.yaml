id: spark-l2-0009
topic: spark
level: 2
title: Store-level min, max and total sales
prompt: |
  For each store, finance wants the smallest sale, the largest sale and the total
  in columns named `min_amount`, `max_amount` and `total`.
context: |
  `df` has columns `sale_id`, `store_id` and `amount`.
  `F` is `pyspark.sql.functions`.
options:
  - code: |
      df.groupBy("store_id").agg({"amount": "min", "amount": "max", "amount": "sum"})
    correct: false
    explanation: >-
      A Python dict can't hold the same key three times, so only the last entry
      (`sum`) survives, and its column is named `sum(amount)`.
  - code: |
      df.groupBy("store_id").agg(F.min("amount"), F.max("amount"), F.sum("amount"))
    correct: false
    explanation: >-
      The values are right, but without aliases the columns are named
      `min(amount)`, `max(amount)` and `sum(amount)`.
  - code: |
      df.groupBy("store_id").min("amount").max("amount")
    correct: false
    explanation: >-
      `GroupedData.min` already returns an aggregated DataFrame, and a DataFrame
      has no `max` aggregation method, so this fails.
  - code: |
      df.groupBy("store_id").agg(F.min("amount").alias("min_amount"),
                                 F.max("amount").alias("max_amount"),
                                 F.sum("amount").alias("total"))
    correct: true
    explanation: >-
      A single `agg` call computes all three aggregates in one pass, and each
      alias gives its column the required name.
tags: [group-by, aggregate-functions]
docs_url: https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.GroupedData.agg.html
status: approved
