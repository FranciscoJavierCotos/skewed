id: spark-l3-0017
topic: spark
level: 3
title: Forward-fill the last known price
prompt: |
  A price feed only records a value when the price changes; other days have a
  null `price`. Add `price_filled`: on each day, the most recent non-null price
  of the same product up to and including that day. Several nulls can follow in
  a row.
context: |
  `df` has columns `product_id`, `day` (unique per product) and `price` (nullable).
  `F` is `pyspark.sql.functions` and `Window` is `pyspark.sql.Window`.
options:
  - code: |
      w = (Window.partitionBy("product_id").orderBy("day")
           .rowsBetween(Window.unboundedPreceding, Window.currentRow))
      df.withColumn("price_filled", F.last("price", ignorenulls=True).over(w))
    correct: true
    explanation: >-
      With `ignorenulls`, `last` returns the latest non-null price in the frame up
      to the current row, which carries it over any run of nulls.
  - code: |
      w = (Window.partitionBy("product_id").orderBy("day")
           .rowsBetween(Window.unboundedPreceding, Window.currentRow))
      df.withColumn("price_filled", F.last("price").over(w))
    correct: false
    explanation: >-
      Without `ignorenulls`, `last` returns the current row's value, so null days
      stay null.
  - code: |
      w = Window.partitionBy("product_id").orderBy("day")
      df.withColumn("price_filled", F.coalesce("price", F.lag("price").over(w)))
    correct: false
    explanation: >-
      `lag` only looks one row back, so the second null in a row picks up the
      previous null and stays null.
  - code: |
      w = (Window.partitionBy("product_id").orderBy("day")
           .rowsBetween(Window.unboundedPreceding, Window.currentRow))
      df.withColumn("price_filled", F.first("price", ignorenulls=True).over(w))
    correct: false
    explanation: >-
      `first` returns the earliest known price, so after a price change the old
      price keeps being used.
tags: [window-functions, null-semantics, forward-fill]
docs_url: https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.functions.last.html
status: approved
