id: sql-l5-0006
topic: sql
level: 5
title: Fix a row estimate skewed by correlated columns
prompt: |
  In `addresses`, `zip` determines `city`, so the two columns are strongly
  correlated. For `WHERE city = 'c1' AND zip = 'z1'` the planner multiplies
  the two selectivities and estimates about **100** rows, while about
  **1000** come back, which leads it into a bad nested loop. Which change
  makes the planner's estimate close to 1000?
context: |
  addresses(id, city, zip)   -- 10 000 rows, 10 cities, one zip per city
options:
  - code: |
      CREATE STATISTICS addresses_city_zip (dependencies)
        ON city, zip FROM addresses;
      ANALYZE addresses;
    correct: true
    explanation: >-
      Extended dependency statistics record that zip determines city, and the
      ANALYZE populates them, so the planner stops treating the columns as
      independent.
  - code: |
      CREATE STATISTICS addresses_city_zip (ndistinct)
        ON city, zip FROM addresses;
      ANALYZE addresses;
    correct: false
    explanation: >-
      ndistinct statistics improve estimates of how many groups a GROUP BY on
      both columns returns, but they aren't used for the selectivity of WHERE
      conditions.
  - code: |
      CREATE INDEX addresses_city_zip_idx
        ON addresses (city, zip);
      ANALYZE addresses;
    correct: false
    explanation: >-
      An index on plain columns adds no cross-column statistics, so the planner
      still multiplies the per-column selectivities.
  - code: |
      ALTER TABLE addresses ALTER COLUMN zip
        SET STATISTICS 1000;
      ANALYZE addresses;
    correct: false
    explanation: >-
      A larger statistics target refines per-column histograms, but it still
      assumes the columns are independent, so the estimate doesn't change.
tags: [planner-statistics, explain, extended-statistics]
docs_url: https://www.postgresql.org/docs/17/planner-stats.html#PLANNER-STATS-EXTENDED
status: approved
