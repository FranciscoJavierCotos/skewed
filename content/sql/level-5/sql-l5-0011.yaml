id: sql-l5-0011
topic: sql
level: 5
title: Round invoice amounts half away from zero
prompt: |
  Legacy invoices store `amount` as `double precision`. The billing rules
  say to round to whole euros with ties going **away from zero**: 2.5 → 3,
  -2.5 → -3, 2.4 → 2. Return each invoice's rounded amount.
context: |
  invoices(id, amount double precision)
options:
  - code: |
      SELECT id, round(amount::numeric) AS rounded
      FROM invoices;
    correct: true
    explanation: >-
      round on numeric always breaks ties away from zero, so casting the double
      to numeric first gives the billing rule.
  - code: |
      SELECT id, round(amount) AS rounded
      FROM invoices;
    correct: false
    explanation: >-
      round on double precision breaks ties in a platform-dependent way,
      usually to the nearest even number, so 2.5 becomes 2.
  - code: |
      SELECT id, trunc(amount + 0.5) AS rounded
      FROM invoices;
    correct: false
    explanation: >-
      Adding 0.5 and truncating works for positive amounts, but -2.5 becomes
      trunc(-2.0) = -2 instead of -3.
  - code: |
      SELECT id, ceil(amount) AS rounded
      FROM invoices;
    correct: false
    explanation: >-
      ceil always rounds up, so 2.4 becomes 3 instead of 2.
tags: [numeric-semantics, rounding, data-types]
docs_url: https://www.postgresql.org/docs/17/functions-math.html
status: approved
