id: sql-l4-0005
topic: sql
level: 4
title: Missing invoice number ranges
prompt: |
  Auditors require invoice numbers to have no gaps. Report every gap as a
  **range** of missing numbers, one row per gap, with `gap_start` and
  `gap_end` (both inclusive). For example, if 3 and 6 exist but 4 and 5 don't,
  report the single row (4, 5).
context: |
  invoices(invoice_no integer)   -- unique
options:
  - code: |
      SELECT invoice_no + 1 AS gap_start, next_no - 1 AS gap_end
      FROM (SELECT invoice_no,
                   LEAD(invoice_no) OVER (ORDER BY invoice_no) AS next_no
            FROM invoices) t
      WHERE next_no - invoice_no > 1;
    correct: true
    explanation: >-
      LEAD pairs each number with the next existing one, and a jump of more
      than 1 means everything strictly between them is missing.
  - code: |
      SELECT invoice_no + 1 AS gap_start, next_no - 1 AS gap_end
      FROM (SELECT invoice_no,
                   LEAD(invoice_no) OVER (ORDER BY invoice_no) AS next_no
            FROM invoices) t
      WHERE next_no - invoice_no > 0;
    correct: false
    explanation: >-
      Consecutive numbers differ by 1, which also passes > 0, so every
      adjacent pair is reported as a gap with gap_end below gap_start.
  - code: |
      SELECT n AS gap_start, n AS gap_end
      FROM generate_series((SELECT MIN(invoice_no) FROM invoices),
                           (SELECT MAX(invoice_no) FROM invoices)) n
      WHERE n NOT IN (SELECT invoice_no FROM invoices);
    correct: false
    explanation: >-
      This finds every missing number, but reports each one as its own row
      instead of one range per gap.
  - code: |
      SELECT invoice_no AS gap_start, next_no AS gap_end
      FROM (SELECT invoice_no,
                   LEAD(invoice_no) OVER (ORDER BY invoice_no) AS next_no
            FROM invoices) t
      WHERE next_no - invoice_no > 1;
    correct: false
    explanation: >-
      The bounds are the existing numbers on either side of the gap, so each
      range wrongly includes two invoices that do exist.
tags: [gaps-and-islands, lag-lead, generate-series]
docs_url: https://www.postgresql.org/docs/17/functions-window.html
status: approved
