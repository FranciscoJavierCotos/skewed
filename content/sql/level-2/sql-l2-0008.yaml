id: sql-l2-0008
topic: sql
level: 2
title: Monthly revenue across several years
prompt: |
  The orders table holds two years of history (2025 and 2026). The board deck
  needs revenue per **calendar month**, with January 2025 and January 2026 as
  separate rows, ordered by month.
context: |
  orders(order_id, ordered_at timestamp, amount)
options:
  - code: |
      SELECT EXTRACT(MONTH FROM ordered_at) AS month, SUM(amount) AS revenue
      FROM orders
      GROUP BY EXTRACT(MONTH FROM ordered_at)
      ORDER BY month;
    correct: false
    explanation: >-
      EXTRACT(MONTH ...) returns only the month number, so January 2025 and
      January 2026 fall into the same group.
  - code: |
      SELECT ordered_at::date AS month, SUM(amount) AS revenue
      FROM orders
      GROUP BY ordered_at::date
      ORDER BY month;
    correct: false
    explanation: >-
      Casting to date groups by day, so this returns daily revenue, with one
      row per day rather than per month.
  - code: |
      SELECT date_trunc('month', ordered_at) AS month, SUM(amount) AS revenue
      FROM orders
      GROUP BY date_trunc('month', ordered_at)
      ORDER BY month;
    correct: true
    explanation: >-
      date_trunc('month', ...) rounds each timestamp down to the first day of
      its month and keeps the year, so each calendar month is its own group.
  - code: |
      SELECT date_trunc('month', ordered_at) AS month, SUM(amount) AS revenue
      FROM orders
      GROUP BY ordered_at
      ORDER BY month;
    correct: false
    explanation: >-
      The groups are formed on the raw timestamp, so a month with several
      orders appears as several rows that aren't added together.
tags: [group-by, dates, date-trunc]
docs_url: https://www.postgresql.org/docs/17/functions-datetime.html#FUNCTIONS-DATETIME-TRUNC
status: approved
